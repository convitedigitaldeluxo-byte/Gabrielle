<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabriella XV Anos</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow-x:hidden;}
.slide{width:100%;max-width:480px;margin:0 auto;display:block;}
.slide img{width:100%;display:block;}

/* ÍCONES CLICÁVEIS */
.slide-icones{position:relative;width:100%;max-width:480px;margin:0 auto;}
.slide-icones img{width:100%;display:block;}
.icone-link{
  position:absolute;left:50%;transform:translateX(-50%);
  width:38%;aspect-ratio:1;cursor:pointer;
  border-radius:50%;-webkit-tap-highlight-color:rgba(212,175,55,0.3);
  background:transparent;border:none;padding:0;
  z-index:5;
}
.icone-confirmar{top:5%;}
.icone-presente{top:37%;}
.icone-localizacao{top:69%;}

/* MODAL */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:9999;align-items:center;justify-content:center;padding:16px;}
.modal.ativo{display:flex;}
.modal-conteudo{background:#0d0800;border:1px solid #c9a84c;border-radius:12px;max-width:440px;width:100%;max-height:92vh;overflow-y:auto;position:relative;}
.modal-fechar{position:sticky;top:8px;float:right;margin:8px 8px 0 0;background:#0d0800;border:1px solid #c9a84c;color:#c9a84c;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;z-index:10;}
.modal-conteudo img{width:100%;display:block;clear:both;}
.pix-box{padding:20px;text-align:center;border-top:1px solid rgba(201,168,76,0.3);}
.pix-chave{color:#f0d080;font-size:22px;font-weight:700;margin:8px 0 16px;word-break:break-all;}
.pix-label{color:#c9a84c;font-size:12px;letter-spacing:2px;}
.btn-pix{background:linear-gradient(135deg,#c9a84c,#f0d080);color:#0d0800;font-size:16px;font-weight:700;padding:12px 28px;border:none;border-radius:50px;cursor:pointer;font-family:inherit;}
.btn-pix:active{transform:scale(0.97);}
.pix-ok{color:#c9a84c;font-size:13px;margin-top:10px;display:none;}

/* MÚSICA */
.music-btn{
  position:fixed;bottom:20px;right:16px;z-index:9998;
  background:rgba(13,8,0,0.9);border:1px solid #c9a84c;
  border-radius:50px;padding:10px 18px;cursor:pointer;
  color:#c9a84c;font-size:13px;letter-spacing:1px;
  box-shadow:0 4px 20px rgba(201,168,76,0.25);
  font-family:inherit;
}
.music-btn:active{transform:scale(0.97);}
</style>
</head>
<body>

<audio id="musica" loop preload="auto" playsinline>
  <source src="https://archive.org/download/geoffharvey-the-princess-and-her-jewels-120679_202605/geoffharvey-the-princess-and-her-jewels-120679_202605.mp3" type="audio/mpeg">
</audio>

<button class="music-btn" id="btnMusica" type="button">🎵 Música</button>

<!-- 1. CAPA - Gabriella 15 anos -->
<div class="slide">
  <img src="https://archive.org/download/momentos-magicos-merecem-ser-divididos-com-pessoas-como-3/930216CE-D960-4E4B-A8B3-D3AC7F2FBBD7.png" alt="Capa Gabriella 15 anos">
</div>

<!-- 2. MOMENTOS MÁGICOS -->
<div class="slide">
  <img src="https://archive.org/download/momentos-magicos-merecem-ser-divididos-com-pessoas-como-3/Momentos%20ma%CC%81gicos%20merecem%20ser%20divididos%20com%20pessoas%20como%20-%203.png" alt="Momentos mágicos">
</div>

<!-- 3. FOTO PORTA VERDE -->
<div class="slide">
  <img src="https://archive.org/download/momentos-magicos-merecem-ser-divididos-com-pessoas-como-3/2AF253CC-09F8-4762-9785-5E966473ADC8.png" alt="Gabriella porta verde">
</div>

<!-- 4. DATA, HORA E LOCAL -->
<div class="slide">
  <img src="https://archive.org/download/momentos-magicos-merecem-ser-divididos-com-pessoas-como-3/f606d779-1760-40c3-a821-87ee0be2d4f9.jpeg" alt="Data hora e local">
</div>

<!-- 5. FOTO PIANO -->
<div class="slide">
  <img src="https://archive.org/download/momentos-magicos-merecem-ser-divididos-com-pessoas-como-3/107DDC47-C754-4115-8258-5976FB0F7765.png" alt="Gabriella no piano">
</div>

<!-- 6. PARA TORNAR ESSA NOITE -->
<div class="slide">
  <img src="https://archive.org/download/042-c-254-a-e-3-a-7-4-f-06-9-f-84-99-e-126-abd-713-3_202605/042C254A-E3A7-4F06-9F84-99E126ABD713%203.PNG" alt="Para tornar essa noite">
</div>

<!-- 7. ÍCONES INTERATIVOS -->
<div class="slide-icones">
  <img src="https://archive.org/download/momentos-magicos-merecem-ser-divididos-com-pessoas-como-3/6176f942-5f52-4419-96dd-eab709abdecd.jpeg" alt="Ícones de interação">
  <button type="button" class="icone-link icone-confirmar" id="btnConfirmar" aria-label="Confirmar presença"></button>
  <button type="button" class="icone-link icone-presente" id="btnPresente" aria-label="Lista de presentes"></button>
  <button type="button" class="icone-link icone-localizacao" id="btnLocalizacao" aria-label="Localização"></button>
</div>

<!-- 8. ESSE SONHO -->
<div class="slide">
  <img src="https://archive.org/download/momentos-magicos-merecem-ser-divididos-com-pessoas-como-3/A3AD384E-5F14-4CE5-B5DD-820F01F5D425.png" alt="Esse sonho">
</div>

<!-- 9. FOTO BEIJANDO O SAPO -->
<div class="slide">
  <img src="https://archive.org/download/momentos-magicos-merecem-ser-divididos-com-pessoas-como-3/4FCE50C0-7E6D-4B3C-A1A4-CC64DEB4B9A8.png" alt="Gabriella beijando o sapo">
</div>

<!-- MODAL PRESENTE -->
<div id="modal-presente" class="modal" role="dialog" aria-modal="true">
  <div class="modal-conteudo">
    <button type="button" class="modal-fechar" id="btnFechar" aria-label="Fechar">✕</button>
    <img src="https://archive.org/download/momentos-magicos-merecem-ser-divididos-com-pessoas-como-3/228e57cf-d6b0-4d91-ba47-6d43a5f11aff.jpeg" alt="Sugestões de presentes">
    <div class="pix-box">
      <p class="pix-label">CHAVE PIX</p>
      <p class="pix-chave" id="pixChave">161.398.127-98</p>
      <button type="button" class="btn-pix" id="btnCopiarPix">📋 Copiar Chave PIX</button>
      <p class="pix-ok" id="pix-ok">✅ Chave copiada!</p>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  // ===== MÚSICA =====
  var musica = document.getElementById('musica');
  var btnMusica = document.getElementById('btnMusica');
  var tocando = false;

  function atualizarBtnMusica(){
    btnMusica.textContent = tocando ? '🔇 Pausar' : '🎵 Música';
  }

  function tocarMusica(){
    var p = musica.play();
    if(p && typeof p.then === 'function'){
      p.then(function(){
        tocando = true;
        atualizarBtnMusica();
      }).catch(function(){
        tocando = false;
        atualizarBtnMusica();
      });
    } else {
      tocando = true;
      atualizarBtnMusica();
    }
  }

  function pausarMusica(){
    musica.pause();
    tocando = false;
    atualizarBtnMusica();
  }

  // Tenta iniciar na primeira interação (toque ou clique) em qualquer lugar
  function iniciarNaPrimeiraInteracao(){
    if(!tocando){ tocarMusica(); }
    document.removeEventListener('click', iniciarNaPrimeiraInteracao);
    document.removeEventListener('touchstart', iniciarNaPrimeiraInteracao);
    document.removeEventListener('scroll', iniciarNaPrimeiraInteracao);
  }
  document.addEventListener('click', iniciarNaPrimeiraInteracao, {once:false});
  document.addEventListener('touchstart', iniciarNaPrimeiraInteracao, {once:false, passive:true});
  document.addEventListener('scroll', iniciarNaPrimeiraInteracao, {once:false, passive:true});

  // Botão de música — toggle
  btnMusica.addEventListener('click', function(e){
    e.stopPropagation();
    if(tocando){ pausarMusica(); } else { tocarMusica(); }
  });

  // Sincroniza estado se a música terminar/pausar por outro motivo
  musica.addEventListener('play', function(){ tocando = true; atualizarBtnMusica(); });
  musica.addEventListener('pause', function(){ tocando = false; atualizarBtnMusica(); });

  // ===== MODAL =====
  var modalPresente = document.getElementById('modal-presente');

  function abrirModal(){
    modalPresente.classList.add('ativo');
    document.body.style.overflow = 'hidden';
  }
  function fecharModal(){
    modalPresente.classList.remove('ativo');
    document.body.style.overflow = '';
  }

  // Fecha clicando fora do conteúdo
  modalPresente.addEventListener('click', function(e){
    if(e.target === modalPresente){ fecharModal(); }
  });

  // Fecha com tecla ESC
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && modalPresente.classList.contains('ativo')){
      fecharModal();
    }
  });

  document.getElementById('btnFechar').addEventListener('click', function(e){
    e.stopPropagation();
    fecharModal();
  });

  // ===== ÍCONES =====
  document.getElementById('btnConfirmar').addEventListener('click', function(e){
    e.preventDefault();
    e.stopPropagation();
    window.open('https://wa.link/3bqhmp', '_blank', 'noopener');
  });

  document.getElementById('btnPresente').addEventListener('click', function(e){
    e.preventDefault();
    e.stopPropagation();
    abrirModal();
  });

  document.getElementById('btnLocalizacao').addEventListener('click', function(e){
    e.preventDefault();
    e.stopPropagation();
    window.open('https://maps.app.goo.gl/X4CpDFcjUMN3WUUs7', '_blank', 'noopener');
  });

  // ===== COPIAR PIX (com fallback) =====
  var CHAVE_PIX = '161.398.127-98';

  function mostrarConfirmacao(){
    var el = document.getElementById('pix-ok');
    el.style.display = 'block';
    setTimeout(function(){ el.style.display = 'none'; }, 3000);
  }

  function copiarPixFallback(){
    // Fallback para navegadores antigos ou contextos não-HTTPS
    try {
      var textarea = document.createElement('textarea');
      textarea.value = CHAVE_PIX;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      textarea.style.top = '0';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      textarea.setSelectionRange(0, CHAVE_PIX.length);
      var sucesso = document.execCommand('copy');
      document.body.removeChild(textarea);
      if(sucesso){
        mostrarConfirmacao();
      } else {
        alert('Copie a chave PIX manualmente: ' + CHAVE_PIX);
      }
    } catch(err){
      alert('Copie a chave PIX manualmente: ' + CHAVE_PIX);
    }
  }

  document.getElementById('btnCopiarPix').addEventListener('click', function(e){
    e.preventDefault();
    e.stopPropagation();
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(CHAVE_PIX).then(function(){
        mostrarConfirmacao();
      }).catch(function(){
        copiarPixFallback();
      });
    } else {
      copiarPixFallback();
    }
  });

})();
</script>
</body>
</html>
