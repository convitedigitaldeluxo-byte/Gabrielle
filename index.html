<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabriella XV Anos</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow-x:hidden;}
.slide{width:100%;max-width:480px;margin:0 auto;display:block;}
.slide img{width:100%;display:block;}

/* ÍCONES CLICÁVEIS */
.slide-icones{position:relative;width:100%;max-width:480px;margin:0 auto;}
.slide-icones img{width:100%;display:block;}
.icone-link{
  position:absolute;left:50%;transform:translateX(-50%);
  width:38%;aspect-ratio:1;cursor:pointer;
  border-radius:50%;-webkit-tap-highlight-color:rgba(212,175,55,0.3);
  background:transparent;border:none;padding:0;
}
.icone-confirmar{top:5%;}
.icone-presente{top:37%;}
.icone-localizacao{top:69%;}

/* MODAL */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:9999;align-items:center;justify-content:center;padding:16px;}
.modal.ativo{display:flex;}
.modal-conteudo{background:#0d0800;border:1px solid #c9a84c;border-radius:12px;max-width:440px;width:100%;max-height:92vh;overflow-y:auto;position:relative;}
.modal-fechar{position:sticky;top:8px;float:right;margin:8px 8px 0 0;background:#0d0800;border:1px solid #c9a84c;color:#c9a84c;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
.modal-conteudo img{width:100%;display:block;clear:both;}
.pix-box{padding:20px;text-align:center;border-top:1px solid rgba(201,168,76,0.3);}
.pix-chave{color:#f0d080;font-size:22px;font-weight:700;margin:8px 0 16px;}
.pix-label{color:#c9a84c;font-size:12px;letter-spacing:2px;}
.btn-pix{background:linear-gradient(135deg,#c9a84c,#f0d080);color:#0d0800;font-size:16px;font-weight:700;padding:12px 28px;border:none;border-radius:50px;cursor:pointer;}
.pix-ok{color:#c9a84c;font-size:13px;margin-top:10px;display:none;}

/* MÚSICA */
.music-btn{
  position:fixed;bottom:20px;right:16px;z-index:9998;
  background:rgba(13,8,0,0.9);border:1px solid #c9a84c;
  border-radius:50px;padding:10px 18px;cursor:pointer;
  color:#c9a84c;font-size:13px;letter-spacing:1px;
  box-shadow:0 4px 20px rgba(201,168,76,0.25);
}
</style>
</head>
<body>

<audio id="musica" loop>
  <source src="https://archive.org/download/geoffharvey-the-princess-and-her-jewels-120679_202605/geoffharvey-the-princess-and-her-jewels-120679_202605.mp3" type="audio/mpeg">
</audio>

<button class="music-btn" onclick="toggleMusica()" id="btnMusica">🎵 Música</button>

<!-- 1. CAPA -->
<div class="slide">
  <img src="https://i.ibb.co/6cWQFzSJ/930216-CE-D960-4-E4-B-A8-B3-D3-AC7-F2-FBBD7.png" alt="Capa">
</div>

<!-- 2. CONVITE -->
<div class="slide">
  <img src="https://i.ibb.co/JRYY56sm/Momentos-m-gicos-merecem-ser-divididos-com-pessoas-como-3.png" alt="Convite">
</div>

<!-- 3. FOTO PORTA -->
<div class="slide">
  <img src="https://i.ibb.co/0y3Ck7gb/2-AF253-CC-09-F8-4762-9785-5-E966473-ADC8.png" alt="Gabriella">
</div>

<!-- 4. DATA E LOCAL -->
<div class="slide">
  <img src="https://i.ibb.co/MD2QcDsL/f606d779-1760-40c3-a821-87ee0be2d4f9.jpg" alt="Data e Local">
</div>

<!-- 5. FOTO PIANO -->
<div class="slide">
  <img src="https://i.ibb.co/1GXQ4whK/107-DDC47-C754-4115-8258-5976-FB0-F7765.png" alt="Gabriella piano">
</div>

<!-- 6. INSTRUÇÕES -->
<div class="slide">
  <img src="https://i.ibb.co/WvqLQtXb/d929c5f7-8686-48bd-a288-575394534e19.jpg" alt="Instruções">
</div>

<!-- 7. ÍCONES INTERATIVOS -->
<div class="slide-icones">
  <img src="https://i.ibb.co/sJztBnJf/6176f942-5f52-4419-96dd-eab709abdecd.jpg" alt="Ícones">
  <button class="icone-link icone-confirmar" onclick="window.open('https://wa.link/3bqhmp','_blank')"></button>
  <button class="icone-link icone-presente" onclick="abrirModal('modal-presente')"></button>
  <button class="icone-link icone-localizacao" onclick="window.open('https://maps.app.goo.gl/X4CpDFcjUMN3WUUs7','_blank')"></button>
</div>

<!-- 8. ESSE SONHO -->
<div class="slide">
  <img src="https://i.ibb.co/MyKMYzmD/A3-AD384-E-5-F14-4-CE5-B5-DD-820-F01-F5-D425.png" alt="Esse sonho">
</div>

<!-- 9. FOTO JARDIM SAPO -->
<div class="slide">
  <img src="https://i.ibb.co/2Y52QmBX/4-FCE50-C0-7-E6-D-4-B3-C-A1-A4-CC64-DEB4-B9-A8.png" alt="Gabriella sapo">
</div>

<!-- MODAL PRESENTE -->
<div id="modal-presente" class="modal">
  <div class="modal-conteudo">
    <button class="modal-fechar" onclick="fecharModal('modal-presente')">✕</button>
    <img src="https://i.ibb.co/CpbWgvZR/228e57cf-d6b0-4d91-ba47-6d43a5f11aff.jpg" alt="Sugestões de presentes">
    <div class="pix-box">
      <p class="pix-label">CHAVE PIX</p>
      <p class="pix-chave">161.398.127-98</p>
      <button class="btn-pix" onclick="copiarPix()">📋 Copiar Chave PIX</button>
      <p class="pix-ok" id="pix-ok">✅ Chave copiada!</p>
    </div>
  </div>
</div>

<script>
// MÚSICA
const musica = document.getElementById('musica');
const btn = document.getElementById('btnMusica');
let tocando = false;

document.body.addEventListener('click', function inicio(){
  if(!tocando){
    musica.play().then(()=>{ tocando=true; btn.textContent='🔇 Pausar'; }).catch(()=>{});
  }
  document.body.removeEventListener('click', inicio);
},{once:true});

function toggleMusica(){
  if(tocando){ musica.pause(); tocando=false; btn.textContent='🎵 Música'; }
  else{ musica.play(); tocando=true; btn.textContent='🔇 Pausar'; }
}

// MODAL
function abrirModal(id){ document.getElementById(id).classList.add('ativo'); document.body.style.overflow='hidden'; }
function fecharModal(id){ document.getElementById(id).classList.remove('ativo'); document.body.style.overflow=''; }
document.querySelectorAll('.modal').forEach(m=>{
  m.addEventListener('click',function(e){ if(e.target===this) fecharModal(this.id); });
});

// PIX
function copiarPix(){
  navigator.clipboard.writeText('161.398.127-98').then(()=>{
    const el=document.getElementById('pix-ok');
    el.style.display='block';
    setTimeout(()=>el.style.display='none',3000);
  });
}
</script>
</body>
</html>
